{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if categoria else 'Nueva' }} categoría{% endblock %}
{% block contenido %}
<h2 class="h4 mb-3">{{ 'Editar categoría' if categoria else 'Registrar nueva categoría' }}</h2>
<form method="post" class="card card-body shadow-sm" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input class="form-control" id="nombre" name="nombre" value="{{ valores.nombre }}" required maxlength="80">
    </div>
    <div class="mb-3">
        <label class="form-label" for="descripcion">Descripción</label>
        <input class="form-control" id="descripcion" name="descripcion" value="{{ valores.descripcion }}" maxlength="255">
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" href="{{ url_for('categorias.lista') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
