{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if libro else 'Nuevo' }} libro{% endblock %}
{% block contenido %}
<h2 class="h4 mb-3">{{ 'Editar libro' if libro else 'Registrar nuevo libro' }}</h2>
<form method="post" class="card card-body shadow-sm" style="max-width: 700px;">
    <div class="mb-3">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-control" id="titulo" name="titulo" value="{{ valores.titulo }}" required maxlength="150">
    </div>
    <div class="mb-3">
        <label class="form-label" for="autor">Autor</label>
        <input class="form-control" id="autor" name="autor" value="{{ valores.autor }}" required maxlength="100">
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label" for="anio">Año de publicación</label>
            <input class="form-control" type="number" id="anio" name="anio" value="{{ valores.anio }}" required min="1000">
        </div>
        <div class="col-md-8 mb-3">
            <label class="form-label" for="categoria_id">Categoría</label>
            <select class="form-select" id="categoria_id" name="categoria_id" required>
                <option value="">-- Seleccione --</option>
                {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if valores.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="descripcion">Descripción</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ valores.descripcion }}</textarea>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="disponible" name="disponible" {% if valores.disponible %}checked{% endif %}>
        <label class="form-check-label" for="disponible">Disponible para préstamo</label>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" href="{{ url_for('libros.lista') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
